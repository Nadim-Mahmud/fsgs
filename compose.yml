services:
  fsgs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-8.6}
        MAX_JOBS: ${MAX_JOBS:-4}
    image: fsgs:latest
    # Open the shell directly; preprocess.sh starts its own virtual display.
    entrypoint: []
    command: ["/bin/bash"]
    working_dir: /workspace/fsgs
    environment:
      QT_QPA_PLATFORM: xcb
      DISPLAY: :99
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - .:/workspace/fsgs
      - ${DATASET_PATH:-/home/vis/Projects/tandt/}:/workspace/ImgData
    ports:
      - "127.0.0.1:6009:6009"
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
